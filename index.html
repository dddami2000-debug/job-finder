<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 채용공고</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #1d2521;
        background: #f4f6f4;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, calc(100% - 32px));
        padding: 42px;
        border: 1px solid #e0e5e1;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(29, 37, 33, 0.08);
      }

      h1 {
        margin: 0 0 30px;
        font-size: 34px;
        letter-spacing: -0.05em;
      }

      .fields {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
      }

      input {
        width: 100%;
        height: 50px;
        border: 1px solid #d8ded9;
        border-radius: 11px;
        padding: 0 14px;
        color: #1d2521;
        background: #ffffff;
        font: inherit;
      }

      input::placeholder {
        color: #9ca49f;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 3px solid rgba(46, 108, 76, 0.25);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        height: 52px;
        margin-top: 26px;
        border: 0;
        border-radius: 11px;
        color: #ffffff;
        background: #1d4d39;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }

      .list-controls {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-top: 32px;
      }

      .list-controls label {
        min-width: 160px;
      }

      select {
        height: 44px;
        border: 1px solid #d8ded9;
        border-radius: 11px;
        padding: 0 38px 0 12px;
        color: #1d2521;
        background: #ffffff;
        font: inherit;
      }

      .job-list {
        display: grid;
        gap: 14px;
        margin-top: 32px;
      }

      .job-list-title {
        margin: 0 0 2px;
        color: #56605a;
        font-size: 15px;
        font-weight: 700;
      }

      .job-card {
        display: grid;
        gap: 10px;
        padding: 20px;
        border: 1px solid #e0e5e1;
        border-radius: 15px;
        background: #fbfcfb;
      }

      .job-card > button {
        width: fit-content;
        height: auto;
        margin: 0;
        padding: 8px 12px;
        color: #1d4d39;
        background: #e8f0eb;
        font-size: 13px;
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .card-actions button {
        width: fit-content;
        height: auto;
        margin: 0;
        padding: 8px 12px;
        color: #1d4d39;
        background: #e8f0eb;
        font-size: 13px;
      }

      .job-card details {
        border-top: 1px solid #e0e5e1;
        padding-top: 10px;
        color: #56605a;
        font-size: 14px;
        white-space: pre-line;
      }

      .job-card details summary {
        color: #1d4d39;
        cursor: pointer;
        font-weight: 800;
      }

      .job-card[hidden] {
        display: none;
      }

      .job-card h2 {
        margin: 0;
        color: #1d2521;
        font-size: 19px;
        letter-spacing: -0.03em;
      }

      .organization {
        margin: 0;
        color: #1d4d39;
        font-size: 14px;
        font-weight: 800;
      }

      .job-details {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin: 0;
        color: #56605a;
        font-size: 14px;
      }

      .job-details span {
        display: inline-flex;
        gap: 4px;
      }

      .recommendation-reason {
        margin: 0;
        color: #1d4d39;
        font-size: 13px;
        font-weight: 700;
      }

      .job-card a {
        width: fit-content;
        color: #1d4d39;
        font-size: 14px;
        font-weight: 800;
      }

      .empty-message {
        margin: 0;
        color: #56605a;
        font-size: 14px;
      }

      .saved-section,
      .skipped-section {
        margin-top: 28px;
      }

      .saved-section summary,
      .skipped-section summary {
        color: #56605a;
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
      }

      .save-status {
        min-height: 20px;
        margin: 10px 0 0;
        color: #56605a;
        font-size: 13px;
      }

      .save-status[data-error="true"] {
        color: #a13d32;
      }

      @media (max-width: 520px) {
        main {
          padding: 30px 22px;
        }

        h1 {
          font-size: 30px;
        }

        .list-controls {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>내 채용공고</h1>

      <div class="fields">
        <label for="location">
          희망 지역
          <input id="location" type="text" placeholder="예: 대전" />
        </label>
      </div>

      <button id="search-button" type="button">지역으로 찾기</button>

      <div class="list-controls">
        <p class="job-list-title">지원 자격 확인이 필요한 후보 공고</p>
        <label for="sort-order">
          정렬
          <select id="sort-order">
            <option value="deadline">마감 임박 순</option>
            <option value="antenna">안테나 키워드 순</option>
          </select>
        </label>
      </div>

      <section class="job-list" aria-labelledby="job-list-title">
        <h2 class="job-list-title" id="job-list-title">공고 목록</h2>
        <div id="job-cards" aria-live="polite"></div>
      </section>

      <details class="saved-section" open>
        <summary>실습용 공용 담은 공고 (<span id="saved-count">0</span>)</summary>
        <p class="save-status" id="save-status" role="status" aria-live="polite"></p>
        <div id="saved-cards"></div>
      </details>

      <details class="skipped-section">
        <summary>넘긴 공고 (<span id="skipped-count">0</span>)</summary>
        <div id="skipped-cards"></div>
      </details>
    </main>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";

      const SUPABASE_URL = "https://lwlaytzghoujsnoespdp.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6gv7wmWCzirarEQ-IOn_5g_ZFwuGbTS";
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const locationInput = document.querySelector("#location");
      const searchButton = document.querySelector("#search-button");
      const sortOrder = document.querySelector("#sort-order");
      const jobList = document.querySelector(".job-list");
      const jobCardsContainer = document.querySelector("#job-cards");
      const savedCardsContainer = document.querySelector("#saved-cards");
      const savedCount = document.querySelector("#saved-count");
      const saveStatus = document.querySelector("#save-status");
      const skippedCardsContainer = document.querySelector("#skipped-cards");
      const skippedCount = document.querySelector("#skipped-count");
      const antennaWords = ["안테나", "전자파", "RF", "무선", "전파", "위성통신"];
      let allJobs = [];
      let visibleJobs = [];
      let skippedJobs = [];
      let savedJobIds = new Set();
      let jobCards = [];

      const isIntern = (job) => /인턴/i.test(`${job.employment_type || ""} ${job.recruitment_type || ""}`);
      const isTargetJob = (job) => {
        const region = job.region || "";
        const ncs = job.ncs || "";
        const recruitment = job.recruitment_type || "";
        const qualification = job.qualification || "";
        const requiresExperience = /경력\s*(?:[1-9]\d*|[一二三四五六七八九十])\s*년|경력\s*필수/.test(qualification);
        const mixedExperienceRecruitment = /경력/.test(recruitment);
        return !region.includes("해외") && !requiresExperience && !mixedExperienceRecruitment && /신입/.test(recruitment) && /연구|개발|설계/.test(ncs);
      };
      const antennaScore = (job) => {
        const text = `${job.title || ""} ${job.ncs || ""} ${job.duties || ""}`;
        return antennaWords.some((word) => text.toLowerCase().includes(word.toLowerCase())) ? 1 : 0;
      };
      const compareByDeadline = (a, b) => {
        const deadlineA = a.deadline || "9999-12-31";
        const deadlineB = b.deadline || "9999-12-31";
        return deadlineA.localeCompare(deadlineB) || Number(isIntern(b)) - Number(isIntern(a)) || antennaScore(b) - antennaScore(a);
      };
      const compareByAntenna = (a, b) => antennaScore(b) - antennaScore(a) || compareByDeadline(a, b);
      const sortRecommended = (jobs) => [...jobs].sort(sortOrder.value === "antenna" ? compareByAntenna : compareByDeadline);

      const qualificationSummary = (job) => {
        if (job.qualification) return job.qualification;
        const type = job.employment_type || job.recruitment_type || "채용유형 확인 필요";
        return `${type} · 경력 등 상세 자격은 원문 확인 필요`;
      };

      const setSaveStatus = (message, isError = false) => {
        saveStatus.textContent = message;
        saveStatus.dataset.error = String(isError);
      };

      const applyLocationFilter = () => {
        const selectedLocation = locationInput.value.trim();
        let visibleCount = 0;

        jobCards.forEach((card) => {
          const locations = (card.dataset.location || "").split(",").map((location) => location.trim());
          const matches = !selectedLocation || locations.includes(selectedLocation);
          card.hidden = !matches;
          if (matches) visibleCount += 1;
        });

        const existingMessage = jobList.querySelector(".empty-message");
        existingMessage?.remove();

        if (visibleCount === 0) {
          const message = document.createElement("p");
          message.className = "empty-message";
          message.textContent = "입력한 지역의 공고가 없습니다.";
          jobList.append(message);
        }
      };

      const saveJob = async (job, button) => {
        button.disabled = true;
        setSaveStatus("공고를 저장하는 중입니다.");

        const { error } = await supabase.from("scraps").insert({ job_id: job.id });
        if (error && error.code !== "23505") {
          button.disabled = false;
          setSaveStatus("공고를 담지 못했습니다. 잠시 후 다시 시도해 주세요.", true);
          return;
        }

        savedJobIds.add(String(job.id));
        renderJobs();
        renderSkippedJobs();
        renderSavedJobs();
        setSaveStatus("담은 공고가 Supabase에 저장되었습니다.");
      };

      const createJobCard = (job, { allowSkip = true, allowSave = true } = {}) => {
        const card = document.createElement("article");
        card.className = "job-card";
        card.dataset.location = job.region || "";

        const organization = document.createElement("p");
        organization.className = "organization";
        organization.textContent = job.institution || "";

        const title = document.createElement("h2");
        title.textContent = job.title || "";

        const details = document.createElement("p");
        details.className = "job-details";
        const region = document.createElement("span");
        region.textContent = `근무지역: ${job.region || ""}`;
        const deadline = document.createElement("span");
        deadline.textContent = `마감일: ${job.deadline || ""}`;
        details.append(region, deadline);

        const reason = document.createElement("p");
        reason.className = "recommendation-reason";
        reason.textContent = `추천 기준: ${isIntern(job) ? "인턴 우선" : "마감일 임박"}`;

        const qualification = document.createElement("p");
        qualification.className = "job-details";
        const qualificationText = qualificationSummary(job);
        qualification.textContent = `핵심 지원 자격: ${qualificationText}`;

        const detail = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "주요 업무와 전체 지원 조건 보기";
        const detailText = document.createElement("p");
        detailText.textContent = `관련 직무: ${job.duties || job.ncs || "원문 공고에서 확인"}\n전체 지원 조건: ${qualificationText}`;
        detail.append(summary, detailText);

        const link = document.createElement("a");
        const rawUrl = (job.url || "").trim();
        link.href = rawUrl && /^https?:\/\//i.test(rawUrl) ? rawUrl : rawUrl ? `https://${rawUrl}` : "#";
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = "원문 링크 보기";

        card.append(organization, title, details, qualification, reason, detail, link);
        const toggleDetails = () => { detail.open = !detail.open; };
        card.addEventListener("click", (event) => {
          if (!event.target.closest("a, button, summary")) toggleDetails();
        });
        const actions = document.createElement("div");
        actions.className = "card-actions";

        if (allowSave) {
          const saveButton = document.createElement("button");
          const isSaved = savedJobIds.has(String(job.id));
          saveButton.type = "button";
          saveButton.textContent = isSaved ? "담은 공고" : "담기";
          saveButton.disabled = isSaved;
          saveButton.addEventListener("click", () => saveJob(job, saveButton));
          actions.append(saveButton);
        }

        if (allowSkip) {
          const skipButton = document.createElement("button");
          skipButton.type = "button";
          skipButton.textContent = "넘기기";
          skipButton.addEventListener("click", () => {
            skippedJobs = [...skippedJobs, job];
            visibleJobs = visibleJobs.filter((candidate) => candidate.id !== job.id);
            renderJobs();
            renderSkippedJobs();
          });
          actions.append(skipButton);
        }
        if (actions.childElementCount) card.append(actions);
        return card;
      };

      const renderJobs = () => {
        jobCardsContainer.replaceChildren(...visibleJobs.map((job) => createJobCard(job)));
        jobCards = [...jobCardsContainer.querySelectorAll(".job-card")];
        applyLocationFilter();
      };

      const renderSkippedJobs = () => {
        skippedCount.textContent = String(skippedJobs.length);
        skippedCardsContainer.replaceChildren(...skippedJobs.map((job) => createJobCard(job, { allowSkip: false })));
      };

      const renderSavedJobs = () => {
        const savedJobs = allJobs.filter((job) => savedJobIds.has(String(job.id)));
        savedCount.textContent = String(savedJobs.length);
        if (savedJobs.length === 0) {
          const message = document.createElement("p");
          message.className = "empty-message";
          message.textContent = "아직 담은 공고가 없습니다.";
          savedCardsContainer.replaceChildren(message);
          return;
        }
        savedCardsContainer.replaceChildren(...savedJobs.map((job) => createJobCard(job, { allowSkip: false, allowSave: false })));
      };

      const showLoadError = () => {
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "공고 목록을 불러오지 못했습니다.";
        jobCardsContainer.replaceChildren(message);
      };

      const loadJobs = async () => {
        const [{ data: jobs, error: jobsError }, { data: scraps, error: scrapsError }] = await Promise.all([
          supabase.from("jobs").select("*"),
          supabase.from("scraps").select("job_id"),
        ]);
        if (jobsError) throw jobsError;
        if (scrapsError) throw scrapsError;

        const skippedIds = new Set(skippedJobs.map((job) => job.id));
        allJobs = jobs;
        savedJobIds = new Set(scraps.map((scrap) => String(scrap.job_id)));
        visibleJobs = sortRecommended(allJobs.filter((job) => isTargetJob(job) && !skippedIds.has(job.id)));
        renderJobs();
        renderSkippedJobs();
        renderSavedJobs();
      };

      loadJobs().catch(showLoadError);

      supabase
        .channel("jobs-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, () => {
          loadJobs().catch(showLoadError);
        })
        .subscribe();

      searchButton.addEventListener("click", applyLocationFilter);
      sortOrder.addEventListener("change", () => {
        visibleJobs = sortRecommended(visibleJobs);
        renderJobs();
      });
    </script>
  </body>
</html>
