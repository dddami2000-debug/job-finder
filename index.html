<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 채용공고</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #1d2521;
        background: #f4f6f4;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, calc(100% - 32px));
        padding: 42px;
        border: 1px solid #e0e5e1;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(29, 37, 33, 0.08);
      }

      h1 {
        margin: 0 0 30px;
        font-size: 34px;
        letter-spacing: -0.05em;
      }

      .fields {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
      }

      input {
        width: 100%;
        height: 50px;
        border: 1px solid #d8ded9;
        border-radius: 11px;
        padding: 0 14px;
        color: #1d2521;
        background: #ffffff;
        font: inherit;
      }

      input::placeholder {
        color: #9ca49f;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 3px solid rgba(46, 108, 76, 0.25);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        height: 52px;
        margin-top: 26px;
        border: 0;
        border-radius: 11px;
        color: #ffffff;
        background: #1d4d39;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .job-list {
        display: grid;
        gap: 14px;
        margin-top: 32px;
      }

      .job-list-title {
        margin: 0 0 2px;
        color: #56605a;
        font-size: 15px;
        font-weight: 700;
      }

      .job-card {
        display: grid;
        gap: 10px;
        padding: 20px;
        border: 1px solid #e0e5e1;
        border-radius: 15px;
        background: #fbfcfb;
      }

      .job-card[hidden] {
        display: none;
      }

      .job-card h2 {
        margin: 0;
        color: #1d2521;
        font-size: 19px;
        letter-spacing: -0.03em;
      }

      .organization {
        margin: 0;
        color: #1d4d39;
        font-size: 14px;
        font-weight: 800;
      }

      .job-details {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin: 0;
        color: #56605a;
        font-size: 14px;
      }

      .job-details span {
        display: inline-flex;
        gap: 4px;
      }

      .recommendation-reason {
        margin: 0;
        color: #1d4d39;
        font-size: 13px;
        font-weight: 700;
      }

      .job-card a {
        width: fit-content;
        color: #1d4d39;
        font-size: 14px;
        font-weight: 800;
      }

      .empty-message {
        margin: 0;
        color: #56605a;
        font-size: 14px;
      }

      @media (max-width: 520px) {
        main {
          padding: 30px 22px;
        }

        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>내 채용공고</h1>

      <div class="fields">
        <label for="major">
          학과
          <input id="major" type="text" placeholder="예: 전자공학과" />
        </label>

        <label for="location">
          희망 지역
          <input id="location" type="text" placeholder="예: 대전" />
        </label>

        <label for="graduation">
          졸업 시기
          <input id="graduation" type="text" placeholder="예: 2027년 2월" />
        </label>
      </div>

      <button id="search-button" type="button">검색</button>

      <section class="job-list" aria-labelledby="job-list-title">
        <h2 class="job-list-title" id="job-list-title">공고 목록</h2>
        <div id="job-cards" aria-live="polite"></div>
      </section>
    </main>

    <script>
      const locationInput = document.querySelector("#location");
      const searchButton = document.querySelector("#search-button");
      const jobList = document.querySelector(".job-list");
      const jobCardsContainer = document.querySelector("#job-cards");
      let jobCards = [];

      const applyLocationFilter = () => {
        const selectedLocation = locationInput.value.trim();
        let visibleCount = 0;

        jobCards.forEach((card) => {
          const matches = !selectedLocation || card.dataset.location === selectedLocation;
          card.hidden = !matches;
          if (matches) visibleCount += 1;
        });

        const existingMessage = jobList.querySelector(".empty-message");
        existingMessage?.remove();

        if (visibleCount === 0) {
          const message = document.createElement("p");
          message.className = "empty-message";
          message.textContent = "입력한 지역의 공고가 없습니다.";
          jobList.append(message);
        }
      };

      const createJobCard = (job) => {
        const card = document.createElement("article");
        card.className = "job-card";
        card.dataset.location = job.region || "";

        const organization = document.createElement("p");
        organization.className = "organization";
        organization.textContent = job.institution || "";

        const title = document.createElement("h2");
        title.textContent = job.title || "";

        const details = document.createElement("p");
        details.className = "job-details";
        const region = document.createElement("span");
        region.textContent = `근무지역: ${job.region || ""}`;
        const deadline = document.createElement("span");
        deadline.textContent = `마감일: ${job.deadline || ""}`;
        details.append(region, deadline);

        const reason = document.createElement("p");
        reason.className = "recommendation-reason";
        reason.textContent = "";

        const link = document.createElement("a");
        link.href = job.url || "";
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = "원문 링크 보기";

        card.append(organization, title, details, reason, link);
        return card;
      };

      fetch("jobs.json")
        .then((response) => {
          if (!response.ok) throw new Error("공고 파일을 읽을 수 없습니다.");
          return response.json();
        })
        .then((jobs) => {
          jobCardsContainer.replaceChildren(...jobs.map(createJobCard));
          jobCards = [...jobCardsContainer.querySelectorAll(".job-card")];
          applyLocationFilter();
        })
        .catch(() => {
          const message = document.createElement("p");
          message.className = "empty-message";
          message.textContent = "공고 목록을 불러오지 못했습니다.";
          jobCardsContainer.replaceChildren(message);
        });

      searchButton.addEventListener("click", applyLocationFilter);
    </script>
  </body>
</html>
